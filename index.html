*{box-sizing:border-box;margin:0;padding:0;}
html,body{overflow-x:hidden;max-width:100vw;}body{font-family:'DM Mono','Courier New',monospace;min-height:100vh;transition:background 0.3s,color 0.3s;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:#f97316;border-radius:2px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.fade{animation:fadeIn 0.25s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.slide{animation:slideUp 0.3s cubic-bezier(0.16,1,0.3,1);}
input,select{font-family:inherit;}
input:focus,select:focus{outline:none;}
button{cursor:pointer;font-family:inherit;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:24px 20px 48px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}

/* ── Desktop adaptations ─────────────────────────────────────────────────── */
@media (min-width: 900px) {
  /* Give every view's outer padding more breathing room */
  .fade { padding: 24px 32px !important; }

  /* Two-column stat cards (direct children of a view, like Dashboard's
     "Prom. mensual"/"Mes más alto" pair) become a 4-column row on wide
     screens. We scope this to direct children only, so form field pairs
     inside modals (Cantidad/Unidad, Fecha/Tienda, etc.) are unaffected. */
  .fade > div[style*="grid-template-columns: 1fr 1fr"] {
    grid-template-columns: repeat(4, 1fr) !important;
  }

  /* Modals: center as a proper dialog instead of a bottom sheet */
  .overlay { align-items: center !important; }
  .sheet {
    border-radius: 20px !important;
    max-width: 560px !important;
    max-height: 85vh !important;
  }

  /* Slightly larger base font for readability at arm's length on a monitor */
  body { font-size: 15px; }

  /* Hover affordance for clickable rows/cards already using onMouseEnter,
     but ensure buttons/inputs feel native on desktop (bigger click targets) */
  button { cursor: pointer; }
  input, select { font-size: 14px !important; }
}

@media (min-width: 1200px) {
  /* On very large screens, cap growth so it doesn't feel like an empty page */
  body { display: flex; justify-content: center; }
}
</style>

// ── responsive ────────────────────────────────────────────────────────────────
function useIsDesktop() {
  const [isDesktop, setIsDesktop] = useState(() => typeof window !== 'undefined' && window.innerWidth >= 900);
  useEffect(() => {
    const onResize = () => setIsDesktop(window.innerWidth >= 900);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return isDesktop;
}

const LS_THEME       = 'mercado2026_theme';
const LS_LAST_BACKUP = 'mercado2026_last_backup';
const DB_NAME    = 'mercado2026_local';
const DB_VERSION = 1;
const DB_STORES  = { purchases: 'id', products_dict: 'barcode', settings: 'key' };
const RESTORABLE_SETTINGS = ['taxonomy', 'palette'];

let _dbPromise = null;
function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      for (const [name, keyPath] of Object.entries(DB_STORES))
        if (!db.objectStoreNames.contains(name)) db.createObjectStore(name, { keyPath });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror   = () => { _dbPromise = null; reject(req.error); };
  });
  return _dbPromise;
}

function idbTx(store, mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    let result;
    const r = fn(tx.objectStore(store));
    if (r && 'onsuccess' in r) r.onsuccess = () => { result = r.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror    = () => reject(tx.error);
    tx.onabort    = () => reject(tx.error);
  }));
}

const dbGetAll = table => idbTx(table, 'readonly',  st => st.getAll());
const dbGet    = (table, key) => idbTx(table, 'readonly',  st => st.get(key));
const dbUpsert = (table, rows) => idbTx(table, 'readwrite', st => { for (const r of rows) st.put(r); });
const dbDelete = (table, key) => idbTx(table, 'readwrite', st => { st.delete(key); });
const dbClear  = table => idbTx(table, 'readwrite', st => { st.clear(); });

}

// ── Data loaders ──────────────────────────────────────────────────────────────
async function loadPurchases() {
  const rows = await dbGetAll('purchases');
  if (!rows.length) return null;
  return rows.map(r => r.data);
}

async function savePurchases(purchases) {
  await dbUpsert('purchases', purchases.map(p => ({ id: p.id, data: p })));
}

async function deletePurchase(id) {
  try { await dbDelete('purchases', id); } catch(e) { console.error('deletePurchase:', e); }
}

async function deleteAllPurchases() {
  try { await dbClear('purchases'); } catch(e) { console.error('deleteAllPurchases:', e); }
}

async function loadProductsDict() {
  const rows = await dbGetAll('products_dict');
  if (!rows.length) return null;
  const dict = {};
  for (const r of rows) dict[r.barcode] = r.data;
  return dict;
}

async function saveProductsDict(dict) {
  try {
    await dbUpsert('products_dict', Object.entries(dict).map(([barcode, data]) => ({ barcode, data })));
  } catch(e) { console.error('saveProductsDict:', e); }
}

async function loadSetting(key) {
  try {
    const row = await dbGet('settings', key);
    return row ? row.value : null;
  } catch(e) { return null; }
}

async function saveSetting(key, value) {
  try { await dbUpsert('settings', [{ key, value }]); } catch(e) {}
}

async function loadTaxonomy() {
  try {
    const raw = await loadSetting('taxonomy');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { console.error('loadTaxonomy:', e); return null; }
}

async function saveTaxonomy(obj) {
  try { await saveSetting('taxonomy', JSON.stringify(obj)); } catch(e) { console.error('saveTaxonomy:', e); }
}

const localDayKey = () => {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
};

async function buildBackupPayload() {
  const [pRows, dRows, sRows] = await Promise.all([
    dbGetAll('purchases'), dbGetAll('products_dict'), dbGetAll('settings'),
  ]);
  const productsDict = {};
  for (const r of dRows) productsDict[r.barcode] = r.data;
  const settings = {};
  for (const r of sRows) if (RESTORABLE_SETTINGS.includes(r.key)) settings[r.key] = r.value;
  return {
    app: 'mercado2026-local',
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    purchases: pRows.map(r => r.data),
    productsDict,
    settings,
  };
}

function downloadJSON(payload, filename) {
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
}

// Older backups (purchases only) have no catalogue: rebuild it from the purchases.
function deriveCatalogFromPurchases(ps) {
  const out = {};
  for (const p of ps) {
    if (!p || !p.rawName || !(p.nombre || p.category)) continue;
    const entry = (barcode) => ({
      barcode, rawName: p.rawName, nombre: p.nombre || '', category: p.category || '',
      packageSize: p.packageSize ?? null, packageSizeUnit: p.packageSizeUnit ?? null,
    });
    const nameKey = 'name:' + p.rawName.toLowerCase();
    if (p.barcode && !out[p.barcode]) out[p.barcode] = entry(p.barcode);
    if (!out[nameKey]) out[nameKey] = entry(nameKey);
  }
  return out;
}

// Atomic: either everything is replaced or nothing is.
async function restoreFromBackup(data) {
  const purchases = data.purchases;
  if (!Array.isArray(purchases) || !purchases.every(p => p && p.id != null)) throw new Error('Backup inválido');
  const hasCatalog = data.productsDict && Object.keys(data.productsDict).length > 0;
  let catalogRows;
  if (hasCatalog) {
    catalogRows = Object.entries(data.productsDict).map(([barcode, d]) => ({ barcode, data: d }));
  } else {
    const existing = new Set((await dbGetAll('products_dict')).map(r => r.barcode));
    catalogRows = Object.entries(deriveCatalogFromPurchases(purchases))
      .filter(([k]) => !existing.has(k)).map(([barcode, d]) => ({ barcode, data: d }));
  }
  const db = await openDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(['purchases', 'products_dict', 'settings'], 'readwrite');
    tx.oncomplete = () => resolve();
    tx.onerror = tx.onabort = () => reject(tx.error);
    const ps = tx.objectStore('purchases');
    ps.clear();
    for (const p of purchases) ps.put({ id: p.id, data: p });
    const cs = tx.objectStore('products_dict');
    if (hasCatalog) cs.clear();
    for (const r of catalogRows) cs.put(r);
    if (data.settings) {
      const ss = tx.objectStore('settings');
      for (const [key, value] of Object.entries(data.settings))
        if (RESTORABLE_SETTINGS.includes(key)) ss.put({ key, value });
    }
  });
}

// Smart average: total / elapsed months (capped at today so partial months count proportionally)
function smartAvg(purchases, selectedYear) {
  if (!purchases.length) return { avg: 0, basis: '' };
  const now = new Date();
  const dates = purchases.map(p => new Date(p.date + 'T12:00:00')).filter(d => !isNaN(d));
  if (!dates.length) return { avg: 0, basis: '' };
  const firstDate = new Date(Math.min(...dates));
  // End date: either end of selected year or today, whichever is earlier
  const yearEnd = selectedYear ? new Date(selectedYear, 11, 31) : now;
  const endDate  = yearEnd < now ? yearEnd : now;
  // Elapsed months including partial current month as fraction
  const elapsedMs = endDate - firstDate;
  const elapsedMonths = Math.max(elapsedMs / (1000 * 60 * 60 * 24 * 30.44), 1/30);
  const total = purchases.reduce((a,p) => a + p.total, 0);
  return {
    avg: total / elapsedMonths,
    basis: elapsedMonths.toFixed(1) + ' meses'
  };
}

// "What if cheapest" calculation:
// For each month, find the cheapest price/unit among all purchases that month,
// then compute what total would have been if that price applied to the same quantity.
// For a single product (same friendly name): find cheapest price/unit per month
// and calculate what total would have been at that price each month.
function whatIfCheapest(purchases) {
  if (!purchases.length) return null;
  const byMonth = {};
  for (const p of purchases) {
    const m = monthOf(p.date);
    if (!byMonth[m]) byMonth[m] = [];
    const amount = p.packageSize != null ? p.qty * p.packageSize : p.qty;
    const pricePerUnit = amount > 0 ? p.total / amount : null;
    byMonth[m].push({ ...p, amount, pricePerUnit });
  }
  let actualTotal = 0, cheapestTotal = 0;
  for (const ps of Object.values(byMonth)) {
    const valid = ps.filter(p => p.pricePerUnit != null);
    if (!valid.length) continue;
    const cheapestPrice = Math.min(...valid.map(p => p.pricePerUnit));
    const monthAmount   = valid.reduce((a,p) => a + p.amount, 0);
    actualTotal   += ps.reduce((a,p) => a + p.total, 0);
    cheapestTotal += cheapestPrice * monthAmount;
  }
  const savings = actualTotal - cheapestTotal;
  return savings > 1 ? { actualTotal, cheapestTotal, savings, pct: (savings/actualTotal*100) } : null;
}

// For a category: sum up whatIfCheapest savings per product (friendly name),
// NOT across all products combined (which would wrongly compare chicken vs milk prices).
function whatIfCheapestCat(purchases) {
  if (!purchases.length) return null;
  // Group by friendly name
  const byNombre = {};
  for (const p of purchases) {
    const key = p.nombre || p.rawName;
    if (!byNombre[key]) byNombre[key] = [];
    byNombre[key].push(p);
  }
  let totalActual = 0, totalCheapest = 0;
  for (const ps of Object.values(byNombre)) {
    const wic = whatIfCheapest(ps);
    if (!wic) {
      totalActual += ps.reduce((a,p) => a + p.total, 0);
      totalCheapest += ps.reduce((a,p) => a + p.total, 0); // no savings possible
    } else {
      totalActual   += wic.actualTotal;
      totalCheapest += wic.cheapestTotal;
    }
  }
  const savings = totalActual - totalCheapest;
  return savings > 1 ? { actualTotal: totalActual, cheapestTotal: totalCheapest, savings, pct: (savings/totalActual*100) } : null;
}
const today = () => new Date().toISOString().slice(0,10);

function parsePackageSize(name) {
  name = String(name);
  const patterns = [
    [/(\d+(?:[.,]\d+)?)\s*[Kk][Gg]/, m => [parseFloat(m[1].replace(',','.')), 'kg']],
    [/(\d+(?:[.,]\d+)?)\s*[Gg][Rr]?\.?/, m => [parseFloat(m[1].replace(',','.')) / 1000, 'kg']],
    [/(\d+(?:[.,]\d+)?)\s*[Ll][Tt]?\.?/, m => [parseFloat(m[1].replace(',','.')), 'L']],
    [/(\d+(?:[.,]\d+)?)\s*[Mm][Ll]/, m => [parseFloat(m[1].replace(',','.')) / 1000, 'L']],
    [/(\d+(?:[.,]\d+)?)\s*[Cc][Cc]/, m => [parseFloat(m[1].replace(',','.')) / 1000, 'L']],
    [/(\d+)\s*[Rr][Oo][Ll]{2}?/, m => [parseFloat(m[1]), 'rollos']],
  ];
  for (const [pattern, extractor] of patterns) {
    const m = name.match(pattern);
    if (m) {
      try {
        const [val, unit] = extractor(m);
        return [Math.round(val * 10000) / 10000, unit];
      } catch {}
    }
  }
  return [null, null];
}

function parseXML(text, productsDict) {
  const doc = new DOMParser().parseFromString(text,'text/xml');
  const g = (el,tag) => { const r=el.getElementsByTagNameNS(SIFEN_NS,tag); return r.length?r[0].textContent.trim():null; };
  const gd = tag => g(doc,tag);
  const rawDate = gd('dFeEmiDE')||gd('dFecFirma')||today();
  const date = rawDate.slice(0,10);
  const store = gd('dNomEmi')||'Desconocido';
  const docNum = gd('dNumDoc')||uid();
  const invoiceId = `inv-${docNum}-${date}`;
  const els = doc.getElementsByTagNameNS(SIFEN_NS,'gCamItem');
  const purchases = [];
  for(let i=0;i<els.length;i++){
    const el=els[i];
    const barcode  = g(el,'dCodInt')||g(el,'dCodProd')||'';
    const rawName  = g(el,'dDesProSer')||'Desconocido';
    const qty      = parseFloat(g(el,'dCantProSer')||'1');
    const unit     = g(el,'dDesUniMed')||'UNI';
    const unitPrice= parseFloat(g(el,'dPUniProSer')||'0');
    const total    = parseFloat(g(el,'dTotOpeItem')||'0');
    // Auto-fill from products dictionary — check real barcode first, then name fallback
    const nameKey     = 'name:' + rawName.toLowerCase();
    const byBarcode   = barcode && productsDict[barcode];
    const byName      = productsDict[nameKey];
    const known       = byBarcode || byName;

    // Try to parse package size from the raw invoice name (e.g. "600gr", "1Lt")
    const [parsedSize, parsedUnit] = parsePackageSize(rawName);

    const finalPackageSize     = known?.packageSize     ?? parsedSize;
    const finalPackageSizeUnit = known?.packageSizeUnit ?? parsedUnit;

    purchases.push({
      id:uid(), invoiceId, date, store, rawName,
      barcode: barcode||'',
      category:     known ? known.category : '',
      nombre:       known ? known.nombre   : '',
      packageSize:     finalPackageSize,
      packageSizeUnit: finalPackageSizeUnit,
      qty, unit, unitPrice, total,
      // Flag so the app knows to migrate the name-keyed catalogue entry to this real barcode
      _migrateFromKey: (barcode && byName && !byBarcode) ? nameKey : null,
    });
  }
  return {invoiceId,date,store,purchases};
}

function buildSummary(purchases) {
  const map={};
  for(const p of purchases){
    const cat=p.category||'Sin categoría';
    if(!map[cat])map[cat]={name:cat,months:Array(12).fill(0),total:0,count:0};
    map[cat].months[monthOf(p.date)]+=p.total;
    map[cat].total+=p.total;
    map[cat].count++;
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// Build summary grouped by nombre (friendly name) within a category
function buildNombreSummary(purchases, catName) {
  const catPs = catName ? purchases.filter(p=>(p.category||'Sin categoría')===catName) : purchases;
  const map = {};
  for (const p of catPs) {
    const key = p.nombre || p.rawName;
    if (!map[key]) map[key] = {name:key, months:Array(12).fill(0), total:0, count:0, purchases:[]};
    map[key].months[monthOf(p.date)] += p.total;
    map[key].total += p.total;
    map[key].count++;
    map[key].purchases.push(p);
  }
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// ── COMPARE NOMBRES ───────────────────────────────────────────────────────────
function computeNombreSeries(purchases, nombreName) {
  // Returns {gastoByMonth, cantByMonth, unit, hasPkgSize, total, totalCant}
  const ps = purchases.filter(p => (p.nombre || p.rawName) === nombreName);
  const gasto = Array(12).fill(0);
  const cant  = Array(12).fill(0);
  const hasPkgSize = ps.some(p => p.packageSize != null);
  const unit = hasPkgSize
    ? (ps.find(p=>p.packageSizeUnit)?.packageSizeUnit || 'UNI')
    : (ps[0]?.unit || 'UNI');
  for (const p of ps) {
    const m = monthOf(p.date);
    gasto[m] += p.total;
    const amount = (p.packageSize != null) ? p.qty * p.packageSize : p.qty;
    cant[m] += amount;
  }
  const total = gasto.reduce((a,b)=>a+b,0);
  const totalCant = cant.reduce((a,b)=>a+b,0);
  return {
    gasto, cant, unit, hasPkgSize,
    total, totalCant,
    avgPricePerUnit: totalCant > 0 ? total / totalCant : null,
    count: ps.length,
  };
}

// ── QR SCANNER MODAL ──────────────────────────────────────────────────────────
function QRScanModal({onClose}) {
  const d = useTheme()==='dark';
  const videoRef = useRef();
  const rafRef   = useRef();
  const fileRef  = useRef();
  const [stream,  setStream]  = useState(null);
  const [mode,    setMode]    = useState('camera'); // camera | image
  const [found,   setFound]   = useState(null);     // detected QR URL
  const [camErr,  setCamErr]  = useState('');

  const stopCamera = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    cancelAnimationFrame(rafRef.current);
  };

  // Start camera
  useEffect(() => {
    if (mode !== 'camera') return;
    let active = true;
    async function start() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width:{ideal:1280}, height:{ideal:720} }
        });
        if (!active) { s.getTracks().forEach(t=>t.stop()); return; }
        setStream(s);
        if (videoRef.current) { videoRef.current.srcObject = s; videoRef.current.play(); }
      } catch(e) {
        setCamErr('No se pudo acceder a la cámara.');
        setMode('image');
      }
    }
    start();
    return () => { active = false; };
  }, [mode]);

  // Stop camera when not needed
  useEffect(() => {
    if (mode !== 'camera' || found) stopCamera();
  }, [mode, found]);

  // QR detection loop
  useEffect(() => {
    if (mode !== 'camera' || found) return;
    if (!('BarcodeDetector' in window)) { setMode('image'); return; }
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    let active = true;
    async function tick() {
      if (!active || !videoRef.current || videoRef.current.readyState < 2) {
        rafRef.current = requestAnimationFrame(tick); return;
      }
      try {
        const codes = await detector.detect(videoRef.current);
        for (const c of codes) {
          if (c.rawValue.includes('ekuatia.set.gov.py')) {
            active = false;
            cancelAnimationFrame(rafRef.current);
            setFound(c.rawValue);
            stopCamera();
            return;
          }
        }
      } catch {}
      rafRef.current = requestAnimationFrame(tick);
    }
    rafRef.current = requestAnimationFrame(tick);
    return () => { active = false; cancelAnimationFrame(rafRef.current); };
  }, [mode, found]);

  // Read QR from uploaded image
  const handleImageFile = async e => {
    const file = e.target.files[0]; if (!file) return;
    if (!('BarcodeDetector' in window)) {
      alert('Tu navegador no soporta lectura de QR desde imagen. Usá Chrome.'); return;
    }
    try {
      const bitmap = await createImageBitmap(file);
      const codes  = await new BarcodeDetector({ formats: ['qr_code'] }).detect(bitmap);
      const ekuatia = codes.find(c => c.rawValue.includes('ekuatia.set.gov.py'));
      if (ekuatia) { setFound(ekuatia.rawValue); }
      else if (codes.length) { alert('QR detectado pero no pertenece a ekuatia: ' + codes[0].rawValue.slice(0,80)); }
      else { alert('No se detectó ningún código QR en la imagen.'); }
    } catch(e) { alert('Error al leer la imagen: ' + e.message); }
  };

  return (
    <Modal title="Escanear factura QR" onClose={()=>{ stopCamera(); onClose(); }}>

      {!found && mode==='camera' && (
        <div>
          {camErr && <div style={{fontSize:12,color:'#f87171',marginBottom:10,textAlign:'center'}}>{camErr}</div>}
          <div style={{position:'relative',borderRadius:14,overflow:'hidden',background:'#000',marginBottom:12}}>
            <video ref={videoRef} style={{width:'100%',display:'block',maxHeight:260,objectFit:'cover'}} playsInline muted/>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
              <div style={{width:170,height:170,borderRadius:12,
                boxShadow:'0 0 0 9999px rgba(0,0,0,0.45)',border:'2px solid #f97316'}}/>
            </div>
          </div>
          <div style={{fontSize:11,color:T.sub(d),textAlign:'center',marginBottom:12}}>
            Apuntá la cámara al QR de la factura
          </div>
          <Btn onClick={()=>{ stopCamera(); setMode('image'); }} variant="ghost">
            📁 Usar imagen en cambio
          </Btn>
        </div>
      )}

      {!found && mode==='image' && (
        <div>
          <div style={{border:`2px dashed ${T.inactBdr(d)}`,borderRadius:14,padding:'32px 20px',
            textAlign:'center',cursor:'pointer',marginBottom:12,transition:'border-color 0.2s'}}
            onClick={()=>fileRef.current.click()}
            onMouseEnter={e=>e.currentTarget.style.borderColor='#f97316'}
            onMouseLeave={e=>e.currentTarget.style.borderColor=d?'#2a2a35':'#d4cfc9'}>
            <div style={{fontSize:36,marginBottom:8}}>🔍</div>
            <div style={{fontSize:13,color:T.text(d),marginBottom:4}}>Seleccionar foto del QR</div>
            <div style={{fontSize:11,color:T.sub(d)}}>Una foto clara del código QR de la factura</div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleImageFile} style={{display:'none'}}/>
          <Btn onClick={()=>{ setCamErr(''); setMode('camera'); }} variant="ghost">
            📷 Usar cámara en cambio
          </Btn>
        </div>
      )}

      {found && (
        <div>
          <div style={{...T.card(d),padding:16,marginBottom:16,borderColor:'#4ade80'}}>
            <div style={{fontSize:13,color:'#4ade80',fontWeight:600,marginBottom:8}}>✓ QR detectado</div>
            <div style={{fontSize:11,color:T.sub(d),wordBreak:'break-all',lineHeight:1.5}}>
              {found.slice(0,80)}…
            </div>
          </div>
          <div style={{background:d?'#1a2a1a':'#f0faf3',border:`1px solid ${d?'#2a4a2a':'#b8e8c8'}`,
            borderRadius:12,padding:'12px 16px',marginBottom:20,fontSize:12,color:d?'#86efac':'#2a7a4a',lineHeight:1.6}}>
            Al abrir ekuatia:<br/>
            1. Ingresá el número de cédula del receptor<br/>
            2. Marcá "No soy robot"<br/>
            3. Tocá <strong>Descargar XML</strong><br/>
            4. Volvé aquí y usá el botón <strong>+ XML</strong> para importarlo
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn onClick={()=>{ setFound(null); setMode('camera'); }} variant="ghost" style={{flex:1}}>
              Volver a escanear
            </Btn>
            <Btn onClick={()=>{ window.open(found, '_blank'); }} style={{flex:2}}>
              🌐 Abrir en ekuatia
            </Btn>
          </div>
        </div>
      )}
    </Modal>
  );
}

  const [useNew,setUseNew]   = useState(false);
  const [qty,setQty]         = useState('1');
  const [unit,setUnit]       = useState('UNI');
  const [total,setTotal]     = useState('');
  const [date,setDate]       = useState(today());
  const [store,setStore]     = useState('');
  const [pkgSize,setPkgSize] = useState('');
  const [pkgUnit,setPkgUnit] = useState('');

    const dict = productsDict || {};
    return [...new Set(Object.values(dict).map(p=>p.rawName))].sort((a,b)=>a.localeCompare(b,'es'));
  },[productsDict]);

  const productSubtext = useMemo(()=>{
    const dict = productsDict || {};
    const map = {};
    for(const p of Object.values(dict)) map[p.rawName] = p.nombre || '';

      if (match.category) setCat(match.category);
      if (match.packageSize != null) setPkgSize(String(match.packageSize));
      if (match.packageSizeUnit) setPkgUnit(match.packageSizeUnit);
    }
  };

  const save = () => {
    const finalCat = useNew ? newCat.trim() : cat;
    if (!rawName.trim()) return alert('Ingresá el nombre del producto');
    if (!finalCat) return alert('Seleccioná una categoría');
    if (!total || parseFloat(total) <= 0) return alert('Ingresá el monto total');

    const barcode = 'name:' + rawName.trim().toLowerCase();
    onAdd({
      id: uid(),
      invoiceId: 'manual-' + uid(),
      date, store: store.trim() || 'Manual',
      rawName: rawName.trim(),
      barcode,
      category: finalCat,
      nombre: nombre || finalCat,
      qty: parseFloat(qty) || 1,
      unit,
      unitPrice: parseFloat(total) / (parseFloat(qty) || 1),
      total: parseFloat(total),
      packageSize: pkgSize ? parseFloat(pkgSize) : null,
      packageSizeUnit: pkgUnit || null,
    });
  };

  return (
    <Modal title="Agregar compra manual" onClose={onClose}>
      <div style={{fontSize:11,color:T.sub(d),marginBottom:16,padding:'10px 12px',background:T.infoBg(d),borderRadius:8,border:`1px solid ${T.inactBdr(d)}`}}>
        💡 Para supermercados sin factura electrónica (XML)
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Nombre del producto (como en el recibo)</FieldLabel>
        <Autocomplete
          value={rawName}
          onChange={handleRawNameChange}
          options={productOptions}
          getSubtext={n=>productSubtext[n]}
          placeholder="ej: Yoghurt Trebol 1Lt"
        />
        <div style={{fontSize:10,color:T.sub(d),marginTop:4}}>Elegí uno existente para autocompletar, o escribí uno nuevo</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        <div><FieldLabel>Fecha</FieldLabel><Inp value={date} onChange={e=>setDate(e.target.value)} type="date"/></div>
        <div><FieldLabel>Tienda</FieldLabel><Inp value={store} onChange={e=>setStore(e.target.value)} placeholder="Local"/></div>
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Nombre friendly</FieldLabel>
        <NombreAutocomplete value={nombre} onChange={v=>{
          setNombre(v);
          if(NOMBRE_TO_CAT[v]){ setCat(NOMBRE_TO_CAT[v]); setUseNew(false); }
        }}/>
        {nombre && NOMBRE_TO_CAT[nombre] && (
          <div style={{fontSize:11,color:'#4ade80',marginTop:5}}>→ Categoría: {NOMBRE_TO_CAT[nombre]}</div>
        )}
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Categoría</FieldLabel>
        <Sel value={useNew?'__new__':cat} onChange={e=>{if(e.target.value==='__new__'){setUseNew(true);setCat('');}else{setUseNew(false);setCat(e.target.value);}}}>
          <option value="">— Seleccionar —</option>
          {allCategories.map(c=><option key={c} value={c}>{c}</option>)}
          <option value="__new__">+ Nueva categoría…</option>
        </Sel>
        {useNew && <Inp value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="Nombre de nueva categoría" style={{marginTop:8,borderColor:'#f97316'}}/>}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        <div><FieldLabel>Cantidad</FieldLabel><Inp value={qty} onChange={e=>setQty(e.target.value)} type="number" step="0.001"/></div>
        <div>
          <FieldLabel>Unidad</FieldLabel>
          <Sel value={unit} onChange={e=>setUnit(e.target.value)}>
            {['UNI','kg','g','L','ml'].map(u=><option key={u}>{u}</option>)}
          </Sel>
        </div>
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Total (₲)</FieldLabel>
        <Inp value={total} onChange={e=>setTotal(e.target.value)} type="number" placeholder="ej: 25000"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
        <div>
          <FieldLabel>Tamaño del envase</FieldLabel>
          <Inp value={pkgSize} onChange={e=>setPkgSize(e.target.value)} type="number" step="0.001" placeholder="ej: 0.5"/>
        </div>
        <div>
          <FieldLabel>Unidad envase</FieldLabel>
          <Sel value={pkgUnit} onChange={e=>setPkgUnit(e.target.value)}>
            <option value="">— N/A —</option>
            {['kg','g','L','ml','rollos','UNI'].map(u=><option key={u}>{u}</option>)}
          </Sel>
        </div>
      </div>

      <Btn onClick={save}>Agregar compra</Btn>
    </Modal>
  );
}

// ── XML IMPORT modal ──────────────────────────────────────────────────────────
function ImportModal({onImport, onClose, usedIds: initialUsedIds, productsDict, productsDictRef}) {
  const d = useTheme()==='dark';
  const [step, setStep]       = useState('pick');
  const [parsed, setParsed]   = useState(null);   // single XML result
  const [batch, setBatch]     = useState(null);   // ZIP batch results
  const [err, setErr]         = useState('');
  const [progress, setProgress] = useState('');
  const ref = useRef();

  const seenInBatch = useRef(new Set());
  // Live usedIds that accumulates as imports happen in this session
  const liveUsedIds = useRef(new Set(initialUsedIds));

  const processXML = (text, filename='') => {
    const result = parseXML(text, productsDictRef ? productsDictRef.current : productsDict);
    if (!result.purchases.length) return { skipped: true, reason: 'Sin ítems', filename };
    if (liveUsedIds.current.has(result.invoiceId)) return { skipped: true, reason: 'Ya importada', filename };
    if (seenInBatch.current.has(result.invoiceId)) return { skipped: true, reason: 'Duplicada en ZIP', filename };
    seenInBatch.current.add(result.invoiceId);
    liveUsedIds.current.add(result.invoiceId);
    return { ...result, filename };
  };

  const handleFile = async e => {
    const file = e.target.files[0]; if (!file) return;
    setErr(''); setProgress('');
    try {
      if (file.name.toLowerCase().endsWith('.zip')) {
        // ── ZIP: extract all XMLs ──────────────────────────────────────────
        setProgress('Leyendo ZIP…');
        const zip = await JSZip.loadAsync(file);
        const xmlFiles = Object.entries(zip.files).filter(([name, f]) =>
          !f.dir && name.toLowerCase().endsWith('.xml')
        );
        if (!xmlFiles.length) { setErr('No se encontraron archivos XML en el ZIP.'); setProgress(''); return; }
        setProgress(`Procesando ${xmlFiles.length} archivos…`);
        const results = [];
        let done = 0;
        for (const [name, zipFile] of xmlFiles) {
          const text = await zipFile.async('text');
          try {
            const r = processXML(text, name);
            results.push(r);
          } catch {
            results.push({ skipped: true, reason: 'XML inválido', filename: name });
          }
          done++;
          setProgress(`Procesando ${done}/${xmlFiles.length}…`);
        }
        setBatch(results);
        setStep('batch-review');
        setProgress('');
      } else {
        // ── Single XML ─────────────────────────────────────────────────────
        const text = await file.text();
        const result = processXML(text, file.name);
        if (result.skipped) { setErr(result.reason === 'Ya importada' ? 'Esta factura ya fue importada.' : 'No se encontraron ítems en el XML.'); return; }
        setParsed(result); setStep('review');
      }
    } catch(e) { setErr('No se pudo leer el archivo: ' + e.message); setProgress(''); }
  };

  const confirmSingle = () => { onImport(parsed); setStep('done'); };

  const confirmBatch = async () => {
    const valid = batch.filter(r => !r.skipped);
    // Combine all purchases from all invoices into one array and import atomically
    const allPurchases = valid.flatMap(r => r.purchases);
    await onImport({ purchases: allPurchases, isBatch: true });
    setStep('done');
  };

  const bdr = d ? '#2a2a35' : '#d4cfc9';
  const validBatch  = batch ? batch.filter(r => !r.skipped) : [];
  const skippedBatch = batch ? batch.filter(r => r.skipped) : [];
  const totalItems   = validBatch.reduce((a,r) => a + r.purchases.length, 0);
  const totalAmount  = validBatch.reduce((a,r) => a + r.purchases.reduce((b,p) => b+p.total, 0), 0);

  return (
    <Modal title="Importar facturas XML" onClose={onClose}>

      {step==='pick' && (
        <>
          <div style={{border:`2px dashed ${bdr}`,borderRadius:14,padding:'36px 20px',textAlign:'center',cursor:'pointer',marginBottom:14,transition:'border-color 0.2s'}}
            onClick={()=>ref.current.click()}
            onMouseEnter={e=>e.currentTarget.style.borderColor='#f97316'}
            onMouseLeave={e=>e.currentTarget.style.borderColor=bdr}>
            <div style={{fontSize:40,marginBottom:10}}>📄</div>
            <div style={{fontSize:14,color:T.text(d),marginBottom:4}}>Seleccionar archivo</div>
            <div style={{fontSize:11,color:T.sub(d)}}>XML individual · o ZIP con múltiples XMLs</div>
          </div>
          <input ref={ref} type="file" accept=".xml,.zip" onChange={handleFile} style={{display:'none'}}/>
          {progress && <div style={{fontSize:12,color:'#60a5fa',padding:'8px 12px',background:d?'#1a2030':'#e8f0ff',borderRadius:8,textAlign:'center'}}>{progress}</div>}
          {err && <div style={{color:'#f87171',fontSize:12,padding:'10px 12px',background:d?'#2a1a1a':'#fff5f5',borderRadius:8,border:'1px solid #5a2a2a'}}>{err}</div>}
        </>
      )}

      {step==='review' && parsed && (
        <>
          <div style={{background:T.infoBg(d),borderRadius:12,padding:'13px 16px',marginBottom:14,border:`1px solid ${T.inactBdr(d)}`}}>
            <div style={{fontSize:14,color:'#f97316',fontWeight:600}}>{parsed.store}</div>
            <div style={{fontSize:11,color:T.sub(d),marginTop:3}}>{parsed.date} · {parsed.purchases.length} ítems · {fmtFull(parsed.purchases.reduce((a,p)=>a+p.total,0))}</div>
            <div style={{fontSize:11,marginTop:4}}>
              <span style={{color:'#4ade80'}}>✓ {parsed.purchases.filter(p=>p.nombre).length} reconocidos</span>
              {parsed.purchases.filter(p=>!p.nombre).length>0 && <span style={{color:'#f97316',marginLeft:8}}>⚠ {parsed.purchases.filter(p=>!p.nombre).length} sin asignar</span>}
            </div>
          </div>
          <div style={{maxHeight:220,overflowY:'auto',borderRadius:10,border:`1px solid ${T.inactBdr(d)}`,marginBottom:14}}>
            {parsed.purchases.map((p,i)=>(
              <div key={i} style={{display:'flex',gap:10,padding:'10px 14px',borderBottom:i<parsed.purchases.length-1?`1px solid ${T.divider(d)}`:'none',alignItems:'center'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:T.text(d),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.rawName}</div>
                  <div style={{display:'flex',gap:5,marginTop:2}}>
                    {p.nombre ? <span className="badge" style={{background:T.okBg(d),color:'#4ade80'}}>✓ {p.nombre}</span>
                      : <span className="badge" style={{background:d?'#2a1500':'#fff3e0',color:'#f97316'}}>⚠ Sin asignar</span>}
                  </div>
                </div>
                <div style={{fontSize:12,color:'#f97316',flexShrink:0,fontWeight:600}}>{fmtFull(p.total)}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn onClick={()=>setStep('pick')} variant="ghost" style={{flex:1}}>Cancelar</Btn>
            <Btn onClick={confirmSingle} style={{flex:2}}>Importar {parsed.purchases.length} ítems ✓</Btn>
          </div>
        </>
      )}

      {step==='batch-review' && batch && (
        <>
          <div style={{...T.glow(d),padding:16,marginBottom:14}}>
            <div style={{fontSize:13,color:T.text(d),marginBottom:10,fontWeight:600}}>Resumen del ZIP</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
              <div>
                <div style={{fontSize:10,color:T.muted(d),textTransform:'uppercase',marginBottom:4}}>A importar</div>
                <div style={{fontSize:18,fontWeight:800,color:'#4ade80'}}>{validBatch.length}</div>
                <div style={{fontSize:10,color:T.sub(d)}}>facturas</div>
              </div>
              <div>
                <div style={{fontSize:10,color:T.muted(d),textTransform:'uppercase',marginBottom:4}}>Ítems</div>
                <div style={{fontSize:18,fontWeight:800,color:T.text(d)}}>{totalItems}</div>
                <div style={{fontSize:10,color:T.sub(d)}}>productos</div>
              </div>
              <div>
                <div style={{fontSize:10,color:T.muted(d),textTransform:'uppercase',marginBottom:4}}>Total</div>
                <div style={{fontSize:18,fontWeight:800,color:'#f97316'}}>{fmt(totalAmount)}</div>
              </div>
            </div>
            {skippedBatch.length > 0 && (
              <div style={{marginTop:12,fontSize:11,color:'#f97316'}}>
                ⚠ {skippedBatch.length} omitidas ({skippedBatch.map(r=>r.reason).join(', ')})
              </div>
            )}
          </div>
          <div style={{maxHeight:200,overflowY:'auto',borderRadius:10,border:`1px solid ${T.inactBdr(d)}`,marginBottom:14}}>
            {validBatch.map((r,i)=>(
              <div key={i} style={{display:'flex',gap:10,padding:'10px 14px',borderBottom:i<validBatch.length-1?`1px solid ${T.divider(d)}`:'none',alignItems:'center'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,color:T.text(d),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.store}</div>
                  <div style={{fontSize:10,color:T.sub(d),marginTop:2}}>{r.date} · {r.purchases.length} ítems</div>
                </div>
                <div style={{fontSize:12,color:'#f97316',fontWeight:600}}>{fmtFull(r.purchases.reduce((a,p)=>a+p.total,0))}</div>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10}}>
            <Btn onClick={()=>{setBatch(null);setStep('pick');}} variant="ghost" style={{flex:1}}>Cancelar</Btn>
            <Btn onClick={confirmBatch} style={{flex:2}}>Importar {validBatch.length} facturas ✓</Btn>
          </div>
        </>
      )}

      {step==='done' && (
        <div style={{textAlign:'center',padding:'24px 0'}}>
          <div style={{fontSize:52,marginBottom:12}}>✅</div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,color:'#4ade80',marginBottom:8}}>¡Importado!</div>
          <div style={{fontSize:13,color:T.muted(d),marginBottom:24}}>Asigná categorías pendientes en Compras</div>
          <Btn onClick={onClose} style={{maxWidth:200,margin:'0 auto'}}>Listo</Btn>
        </div>
      )}
    </Modal>
  );
}


function BackupModal({purchases, onRestore, onEraseAll, onClose}) {
  const d = useTheme()==='dark';
  const [tab,setTab]     = useState('export');
  const [status,setStatus] = useState('');
  const [isErr,setIsErr]   = useState(false);
  const ref = useRef();

  const doExport = async () => {
    try {
      const ts = new Date().toISOString().slice(0,16).replace('T','_').replace(':','-');
      downloadJSON(await buildBackupPayload(), `mercado2026_backup_${ts}.json`);
      setStatus('✅ Backup descargado correctamente.'); setIsErr(false);
    } catch(e) { setStatus('❌ No se pudo crear el backup: ' + e.message); setIsErr(true); }
  };

  const handleFile = async e => {
    const file = e.target.files[0]; if(!file) return;
    try {
      const data = JSON.parse(await file.text());
      if(!data.purchases||!Array.isArray(data.purchases)||!data.purchases.every(p=>p&&p.id!=null)) throw new Error();
      if(!confirm(`¿Restaurar ${data.purchases.length} compras? Reemplaza todos los datos actuales.`)) return;
      await onRestore(data);
      setStatus(`✅ Restauradas ${data.purchases.length} compras.`); setIsErr(false);
    } catch { setStatus('❌ Archivo inválido. Verificá que sea un backup de esta app.'); setIsErr(true); }
  };

  const tabBtn = (id,label) => (
    <button onClick={()=>setTab(id)} style={{flex:1,padding:'9px 0',borderRadius:10,fontSize:12,fontWeight:500,border:`1px solid ${tab===id?'#f97316':T.inactBdr(d)}`,background:tab===id?'#f97316':T.inactBg(d),color:tab===id?'#0f0f13':T.inactClr(d)}}>{label}</button>
  );

  return (
    <Modal title="Backup y restauración" onClose={onClose}>
      <div style={{display:'flex',gap:8,marginBottom:20}}>{tabBtn('export','💾 Exportar')}{tabBtn('restore','📂 Restaurar')}{tabBtn('erase','🗑 Borrar todo')}</div>
      {tab==='export' && (
        <>
          <div style={{background:T.infoBg(d),border:`1px solid ${T.inactBdr(d)}`,borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{fontSize:13,color:T.text(d),marginBottom:6}}>Se descargará un archivo <strong>.json</strong> con todas tus compras, el catálogo y tus categorías.</div>
            <div style={{fontSize:11,color:T.sub(d)}}>{purchases.length} compras registradas</div>
            <div style={{fontSize:11,color:T.sub(d),marginTop:8,lineHeight:1.5}}>
              💡 Además se descarga un backup automático la primera vez que usás la app cada día
              {(()=>{ try{ const l=localStorage.getItem(LS_LAST_BACKUP); return l?` (último: ${l})`:''; }catch{ return ''; } })()}.
            </div>
          </div>
          <Btn onClick={doExport}>Descargar backup</Btn>
        </>
      )}
      {tab==='restore' && (
        <>
          <div style={{background:T.warnBg(d),border:'1px solid #f97316',borderRadius:12,padding:14,marginBottom:14}}>
            <div style={{fontSize:13,color:'#f97316',fontWeight:600,marginBottom:4}}>⚠ Atención</div>
            <div style={{fontSize:12,color:T.warnSub(d)}}>Restaurar reemplaza <strong>todos los datos actuales</strong>.</div>
          </div>
          <div onClick={()=>ref.current.click()}
            style={{border:`2px dashed ${d?'#2a2a35':'#d4cfc9'}`,borderRadius:14,padding:'28px 20px',textAlign:'center',cursor:'pointer',marginBottom:14}}
            onMouseEnter={e=>e.currentTarget.style.borderColor='#f97316'}
            onMouseLeave={e=>e.currentTarget.style.borderColor=d?'#2a2a35':'#d4cfc9'}>
            <div style={{fontSize:36,marginBottom:8}}>📂</div>
            <div style={{fontSize:13,color:T.text(d)}}>Seleccionar archivo .json</div>
          </div>
          <input ref={ref} type="file" accept=".json" onChange={handleFile} style={{display:'none'}}/>
        </>
      )}
      {tab==='erase' && (
        <>
          <div style={{background:T.warnBg(d),border:'1px solid #f87171',borderRadius:12,padding:16,marginBottom:16}}>
            <div style={{fontSize:13,color:'#f87171',fontWeight:600,marginBottom:6}}>⚠️ Borrar todas las compras</div>
            <div style={{fontSize:12,color:T.warnSub(d),lineHeight:1.6}}>
              Esto elimina <strong>todas las compras</strong> de este dispositivo ({purchases.length} compras).<br/>
              El catálogo de productos y categorías <strong>no se borra</strong>.<br/>
              Hacé un backup primero si querés conservar los datos.
            </div>
          </div>
          <Btn onClick={doExport} variant="ghost" style={{marginBottom:10}}>💾 Descargar backup primero</Btn>
          <Btn onClick={async ()=>{
            if (!confirm(`¿Borrar las ${purchases.length} compras? Esta acción no se puede deshacer.`)) return;
            if (!confirm('¿Estás seguro? Se borrarán TODAS las compras.')) return;
            await onEraseAll();
            setStatus('✅ Todas las compras fueron borradas.'); setIsErr(false); setTab('export');
          }} variant="danger">🗑 Borrar todas las compras</Btn>
        </>
      )}

      {status && (
        <div style={{marginTop:14,padding:'10px 14px',borderRadius:10,fontSize:12,background:isErr?(d?'#2a1a1a':'#fff5f5'):(d?'#1a2a1a':'#f0faf3'),color:isErr?'#f87171':'#4ade80',border:`1px solid ${isErr?'#5a2a2a':d?'#2a4a2a':'#b8e8c8'}`}}>
          {status}
        </div>
      )}
    </Modal>
  );
}

    const arr=Array(12).fill(0);
    for(const p of purchases) arr[monthOf(p.date)]+=p.total;
    return arr;
  },[purchases]);
  const activeM  = monthlyTotals.filter(v=>v>0);
  const maxM     = Math.max(...activeM,1);
  const bestIdx  = monthlyTotals.indexOf(Math.max(...monthlyTotals));
  const uncat    = purchases.filter(p=>!p.category).length;

  return (

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>

// ── NOMBRE DETAIL (individual purchases for a nombre) ────────────────────────
function NombreDetail({nombreItem, onBack, onEditPurchase}) {
  const d = useTheme()==='dark';
  const [tab, setTab] = useState('gasto'); // gasto | cantidad | precio
  const ps = nombreItem.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date));

  // Compute price-per-unit for each individual purchase, to find the cheapest
  // and most expensive option bought (e.g. comparing different milk brands).
  // We only compare purchases that share the same real-world unit, since
  // ₲/UNI and ₲/kg aren't directly comparable.
  const pricedPs = useMemo(() => {
    return ps.map(p => {
      const amount = (p.packageSize != null) ? p.qty * p.packageSize : p.qty;
      const realUnit = (p.packageSize != null) ? p.packageSizeUnit : p.unit;
      const pricePerUnit = amount > 0 ? p.total / amount : null;
      return { ...p, pricePerUnit, realUnit };
    });
  }, [ps]);

  const { cheapest, priciest } = useMemo(() => {
    // Group by realUnit so we only compare apples to apples
    const byUnit = {};
    for (const p of pricedPs) {
      if (p.pricePerUnit == null) continue;
      if (!byUnit[p.realUnit]) byUnit[p.realUnit] = [];
      byUnit[p.realUnit].push(p);
    }
    // Use the most common unit group (the one with the most purchases) for the headline comparison
    const groups = Object.values(byUnit).sort((a,b)=>b.length-a.length);
    if (!groups.length || groups[0].length < 2) return { cheapest: null, priciest: null };
    const sorted = [...groups[0]].sort((a,b)=>a.pricePerUnit-b.pricePerUnit);
    return { cheapest: sorted[0], priciest: sorted[sorted.length-1] };
  }, [pricedPs]);
  // Compute quantity and average price per month LIVE from actual purchases,
  // so XML imports and manual additions are always reflected correctly.
  // We track TWO things per month:
  //   - rawCount: sum of qty as bought (e.g. "2 UNI")
  //   - realAmount: sum of qty × packageSize when known (e.g. "1 kg")
  const unit = ps[0]?.unit || UNITS_MAP[nombreItem.name] || 'UNI';
  const pkgUnit = ps.find(p=>p.packageSizeUnit)?.packageSizeUnit || null;
  const hasPkgSize = ps.some(p => p.packageSize != null);

  const rawCountData = useMemo(() => {
    const arr = Array(12).fill(0);
    for (const p of ps) arr[monthOf(p.date)] += p.qty;
    return arr;
  }, [ps]);

  const cantData = useMemo(() => {
    // Real-world amount: qty × packageSize where known, else just qty
    const arr = Array(12).fill(0);
    for (const p of ps) {
      const amount = (p.packageSize != null) ? p.qty * p.packageSize : p.qty;
      arr[monthOf(p.date)] += amount;
    }
    return arr;
  }, [ps]);

  const precioData = useMemo(() => {
    const totals = Array(12).fill(0);
    const counts = Array(12).fill(0);
    for (const p of ps) {
      const m = monthOf(p.date);
      const amount = (p.packageSize != null) ? p.qty * p.packageSize : p.qty;
      if (amount > 0) {
        totals[m] += p.total / amount; // price per unit for this purchase
        counts[m] += 1;
      }
    }
    return totals.map((t,i) => counts[i] > 0 ? t / counts[i] : null);
  }, [ps]);

  const maxGasto   = Math.max(...nombreItem.months.filter(v=>v>0), 1);
  const maxCant    = Math.max(...cantData.filter(v=>v>0), 1);
  const maxPrecio  = Math.max(...precioData.filter(v=>v!=null), 1);

  const tabBtn = (id, label) => (
    <button onClick={()=>setTab(id)} style={{flex:1,padding:'8px 0',borderRadius:9,fontSize:11,fontWeight:500,border:`1px solid ${tab===id?'#f97316':T.inactBdr(d)}`,background:tab===id?'#f97316':T.inactBg(d),color:tab===id?'#0f0f13':T.inactClr(d)}}>
      {label}
    </button>
  );

  return (
    <div className="fade" style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:14}}>
      <button onClick={onBack} style={{alignSelf:'flex-start',padding:'6px 14px',background:T.inactBg(d),border:`1px solid ${T.inactBdr(d)}`,borderRadius:8,color:T.muted(d),fontSize:12}}>← Volver</button>
      <div style={{...T.glow(d),padding:22}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800,marginBottom:4,color:T.text(d)}}>{nombreItem.name}</div>
        <div style={{fontSize:11,color:T.sub(d),marginBottom:10}}>{nombreItem.category||'Sin categoría'} · {ps.length} compras</div>
        <div style={{fontSize:32,fontWeight:800,color:'#f97316',fontFamily:"'Syne',sans-serif",letterSpacing:-1}}>{fmtFull(nombreItem.total)}</div>
        {(() => {
          const { avg, basis } = smartAvg(ps, null);
          return avg > 0 ? (
            <div style={{fontSize:12,color:T.sub(d),marginTop:8}}>
              Promedio real: <strong style={{color:T.text(d)}}>{fmtFull(avg)}/mes</strong>
              <span style={{fontSize:10,marginLeft:6}}>({basis})</span>
            </div>
          ) : null;
        })()}
      </div>

      {/* Smart averages row */}
      {(()=>{
        const { avg: gastoAvg, basis } = smartAvg(ps, null);
        const cantAvg = rawCountData.reduce((a,b)=>a+b,0) > 0 && ps.length > 0
          ? (() => { const { avg } = smartAvg(ps.map(p=>({...p,total:((p.packageSize!=null?p.qty*p.packageSize:p.qty))})), null); return avg; })()
          : 0;
        const priceAvg = (() => {
          const vals = precioData.filter(v=>v!=null);
          return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
        })();
        if (!gastoAvg) return null;
        return (
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:4}}>
            <div style={{...T.card(d),padding:12}}>
              <div style={{fontSize:9,color:T.muted(d),textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Prom. gasto/mes</div>
              <div style={{fontSize:14,fontWeight:700,color:'#f97316'}}>{fmtFull(gastoAvg)}</div>
              <div style={{fontSize:9,color:T.sub(d),marginTop:2}}>{basis}</div>
            </div>
            {rawCountData.some(v=>v>0) && (
              <div style={{...T.card(d),padding:12}}>
                <div style={{fontSize:9,color:T.muted(d),textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Prom. {hasPkgSize?pkgUnit:unit}/mes</div>
                <div style={{fontSize:14,fontWeight:700,color:'#60a5fa'}}>
                  {(cantData.reduce((a,b)=>a+b,0)/Math.max(rawCountData.filter(v=>v>0).length,1)).toFixed(2)}
                </div>
                <div style={{fontSize:9,color:T.sub(d),marginTop:2}}>meses con compras</div>
              </div>
            )}
            {priceAvg > 0 && (
              <div style={{...T.card(d),padding:12}}>
                <div style={{fontSize:9,color:T.muted(d),textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>Precio prom.</div>
                <div style={{fontSize:14,fontWeight:700,color:'#a78bfa'}}>{fmtFull(priceAvg)}</div>
                <div style={{fontSize:9,color:T.sub(d),marginTop:2}}>por {unit}</div>
              </div>
            )}
          </div>
        );
      })()}

      {/* What if cheapest card */}
      {(()=>{
        const wic = whatIfCheapest(ps);
        if (!wic) return null;
        return (
          <div style={{background:d?'#1a2a1a':'#f0faf3',border:`1px solid ${d?'#2a4a2a':'#b8e8c8'}`,borderRadius:12,padding:'12px 16px',marginBottom:4}}>
            <div style={{fontSize:11,color:'#4ade80',fontWeight:600,marginBottom:6}}>💡 Si siempre hubieras comprado la opción más barata del mes</div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontSize:11,color:T.sub(d)}}>Habrías gastado</div>
                <div style={{fontSize:16,fontWeight:700,color:'#4ade80'}}>{fmtFull(wic.cheapestTotal)}</div>
              </div>
              <div style={{textAlign:'center'}}>
                <div style={{fontSize:11,color:T.sub(d)}}>Ahorro</div>
                <div style={{fontSize:16,fontWeight:700,color:'#4ade80'}}>-{fmtFull(wic.savings)}</div>
                <div style={{fontSize:10,color:T.sub(d)}}>({wic.pct.toFixed(0)}% menos)</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:11,color:T.sub(d)}}>Real</div>
                <div style={{fontSize:16,fontWeight:700,color:'#f87171'}}>{fmtFull(wic.actualTotal)}</div>
              </div>
            </div>
          </div>
        );
      })()}

      {/* Tab selector */}
      <div style={{display:'flex',gap:8}}>
        {tabBtn('gasto','💰 Gasto')}
        {tabBtn('cantidad',`📦 Cantidad (${unit})`)}
        {tabBtn('precio',`📈 Precio/${unit}`)}
      </div>

      {/* Gasto tab */}
      {tab==='gasto' && (
        <div style={{...T.card(d),padding:20}}>
          <div style={{fontSize:11,color:T.muted(d),textTransform:'uppercase',letterSpacing:1,marginBottom:16}}>Gasto por mes</div>
          {MONTHS.map((m,i)=>(
            <div key={m} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,opacity:nombreItem.months[i]>0?1:0.35}}>
              <div style={{width:28,fontSize:11,color:T.sub(d),textTransform:'uppercase'}}>{m}</div>
              <div style={{flex:1,height:10,background:T.track(d),borderRadius:5,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${maxGasto>0?(nombreItem.months[i]/maxGasto)*100:0}%`,background:PAL[i%12],borderRadius:5}}/>
              </div>
              <div style={{width:90,fontSize:11,color:nombreItem.months[i]>0?T.text(d):T.sub(d),textAlign:'right'}}>
                {nombreItem.months[i]>0?fmtFull(nombreItem.months[i]):'—'}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Cantidad tab */}
      {tab==='cantidad' && (
        <div style={{...T.card(d),padding:20}}>
          <div style={{fontSize:11,color:T.muted(d),textTransform:'uppercase',letterSpacing:1,marginBottom:16}}>
            Cantidad por mes {hasPkgSize ? `(${unit} → ${pkgUnit})` : `(${unit})`}
          </div>
          {rawCountData.some(v=>v>0) ? MONTHS.map((m,i)=>(
            <div key={m} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10,opacity:rawCountData[i]>0?1:0.35}}>
              <div style={{width:28,fontSize:11,color:T.sub(d),textTransform:'uppercase'}}>{m}</div>
              <div style={{flex:1,height:10,background:T.track(d),borderRadius:5,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${(rawCountData[i]/Math.max(...rawCountData.filter(v=>v>0),1))*100}%`,background:PAL[i%12],borderRadius:5}}/>
              </div>
              <div style={{width:hasPkgSize?150:90,fontSize:11,color:rawCountData[i]>0?T.text(d):T.sub(d),textAlign:'right'}}>
                {rawCountData[i]>0 ? (
                  <>{rawCountData[i] % 1 === 0 ? rawCountData[i] : rawCountData[i].toFixed(2)} {unit}
                  {hasPkgSize && <span style={{color:'#60a5fa'}}> ≈ {cantData[i] % 1 === 0 ? cantData[i] : cantData[i].toFixed(2)} {pkgUnit}</span>}</>
                ) : '—'}

function Autocomplete({value, onChange, options, getSubtext, placeholder='Buscar…', allowNew=true}) {
  const d = useTheme()==='dark';
  const [q, setQ]       = useState(value||'');
  const [open, setOpen] = useState(false);
  const [focused, setFocused] = useState(false);
  const ref = useRef();

  useEffect(()=>{ setQ(value||''); }, [value]);

  useEffect(()=>{
    const fn = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', fn);
    return ()=>document.removeEventListener('mousedown', fn);
  },[]);

  const matches = useMemo(()=>{
    if(!q.trim()) return options.slice(0,8);
    const lq = q.toLowerCase();
    return options.filter(n=>n.toLowerCase().includes(lq)).slice(0,10);
  },[q, options]);

  const select = n => { setQ(n); setOpen(false); onChange(n); };

  return (
    <div ref={ref} style={{position:'relative'}}>
      <input value={q}
        onChange={e=>{ setQ(e.target.value); setOpen(true); onChange(e.target.value); }}
        onFocus={()=>{ setFocused(true); setOpen(true); }}
        onBlur={()=>setFocused(false)}
        placeholder={placeholder}
        style={{width:'100%',padding:'10px 12px',borderRadius:10,fontSize:13,fontFamily:'inherit',
          border:`1px solid ${focused?'#f97316':d?'#2a2a35':'#d4cfc9'}`,
          background:d?'#0f0f13':'#f2f0eb',color:d?'#f0ede8':'#1a1a22'}}
      />
      {open && (matches.length>0 || (allowNew && q.trim())) && (
        <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:100,
          background:d?'#1a1a22':'#fff',border:`1px solid ${d?'#2a2a35':'#d4cfc9'}`,
          borderRadius:10,marginTop:4,maxHeight:220,overflowY:'auto',boxShadow:'0 8px 24px rgba(0,0,0,0.2)'}}>
          {matches.map(n=>(
            <div key={n} onMouseDown={()=>select(n)}
              style={{padding:'10px 14px',fontSize:13,cursor:'pointer',
                borderBottom:`1px solid ${d?'#1f1f28':'#f0ede8'}`,
                color:d?'#f0ede8':'#1a1a22'}}
              onMouseEnter={e=>e.currentTarget.style.background=d?'#22222e':'#f7f5f2'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <span>{n}</span>
              {getSubtext && getSubtext(n) && <span style={{fontSize:10,color:d?'#666':'#aaa',marginLeft:8}}>{getSubtext(n)}</span>}
            </div>
          ))}
          {allowNew && q.trim() && !options.includes(q.trim()) && (
            <div onMouseDown={()=>select(q.trim())}
              style={{padding:'10px 14px',fontSize:12,cursor:'pointer',color:'#f97316',borderTop:matches.length?`1px solid ${d?'#2a2a35':'#e0ddd8'}`:'none'}}>
              + Usar "{q.trim()}" como nuevo
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── CATEGORY MANAGER ──────────────────────────────────────────────────────────
function CategoryManager({onClose, onTaxonomyChange}) {
  const d = useTheme()==='dark';
  const [, forceRerender] = useState(0);

  // Local working copy so edits feel instant; commit to global + local storage on change
  const [cats, setCats] = useState(()=>[...CATEGORIES]);
  const [nombreToCat, setNombreToCat] = useState(()=>({...NOMBRE_TO_CAT}));
  const [selected, setSelected] = useState(cats[0]||'');
  const [renaming, setRenaming] = useState(false);
  const [renameVal, setRenameVal] = useState('');
  const [addingCat, setAddingCat] = useState(false);
  const [newCatName, setNewCatName] = useState('');
  const [movingNombre, setMovingNombre] = useState(null); // nombre being moved
  const [moveTarget, setMoveTarget] = useState('');

  const catToNombres = useMemo(()=>{
    const map = {};
    for(const c of cats) map[c] = [];
    for(const [nombre, cat] of Object.entries(nombreToCat)){
      if(!map[cat]) map[cat]=[];
      map[cat].push(nombre);
    }
    return map;
  },[cats, nombreToCat]);

  const commit = (newCats, newMap) => {
    setCats(newCats);
    setNombreToCat(newMap);
    applyTaxonomyOverride({ categories: newCats, nombreToCat: newMap });
    saveTaxonomy({ categories: newCats, nombreToCat: newMap });
    onTaxonomyChange && onTaxonomyChange();
  };

  const handleAddCategory = () => {
    const name = newCatName.trim();
    if (!name) return;
    if (cats.includes(name)) { alert('Esa categoría ya existe'); return; }
    const newCats = [...cats, name].sort((a,b)=>a.localeCompare(b,'es'));
    commit(newCats, nombreToCat);
    setSelected(name);
    setNewCatName('');
    setAddingCat(false);
  };

  const handleRename = () => {
    const name = renameVal.trim();
    if (!name || name === selected) { setRenaming(false); return; }
    if (cats.includes(name)) { alert('Ya existe una categoría con ese nombre'); return; }
    const newCats = cats.map(c => c === selected ? name : c).sort((a,b)=>a.localeCompare(b,'es'));
    const newMap = {...nombreToCat};
    for (const k of Object.keys(newMap)) if (newMap[k] === selected) newMap[k] = name;
    commit(newCats, newMap);
    setSelected(name);
    setRenaming(false);
  };

  const handleDeleteCategory = () => {
    const count = (catToNombres[selected]||[]).length;
    if (!confirm(count > 0
      ? `"${selected}" tiene ${count} nombres asignados. Se moverán a "Otros". ¿Continuar?`
      : `¿Eliminar la categoría "${selected}"?`)) return;
    const newCats = cats.filter(c => c !== selected);
    const newMap = {...nombreToCat};
    for (const k of Object.keys(newMap)) if (newMap[k] === selected) newMap[k] = 'Otros';
    if (!newCats.includes('Otros')) newCats.push('Otros');
    commit(newCats.sort((a,b)=>a.localeCompare(b,'es')), newMap);
    setSelected(newCats[0]||'');
  };

  const handleMoveNombre = () => {
    if (!movingNombre || !moveTarget) return;
    const newMap = {...nombreToCat, [movingNombre]: moveTarget};
    commit(cats, newMap);
    setMovingNombre(null);
    setMoveTarget('');
  };

  return (
    <Modal title="Editor de categorías" onClose={onClose}>
      <div style={{fontSize:12,color:d?'#888':'#777',marginBottom:14}}>
        Las categorías se asignan automáticamente al elegir un nombre friendly. Podés renombrar, crear, eliminar o mover nombres entre categorías.
      </div>

      <button onClick={()=>{ if(confirm('Esto actualizará la categoría de TODAS tus compras y catálogo según la configuración actual. ¿Continuar?')) onTaxonomyChange && onTaxonomyChange(); }}
        style={{width:'100%',padding:'10px 0',borderRadius:10,fontSize:12,fontWeight:600,marginBottom:10,
          background:d?'#1a2a3a':'#e8f0ff',border:`1px solid ${d?'#2a4a6a':'#b8d4f0'}`,color:'#60a5fa'}}>
        🔄 Reaplicar categorías a todas las compras existentes
      </button>

      <button onClick={async ()=>{
        if(!confirm('Esto borra tu configuración de categorías personalizada y restaura las 15 categorías nuevas (Almacén y Secos, Higiene Personal, etc). ¿Continuar?')) return;
        await dbDelete('settings', 'taxonomy').catch(()=>{});
        CATEGORIES = [...CATEGORIES_SEED];
        NOMBRE_TO_CAT = {...NOMBRE_TO_CAT_SEED};
        ALL_NOMBRES = [...ALL_NOMBRES_SEED];
        setCats([...CATEGORIES]);
        setNombreToCat({...NOMBRE_TO_CAT});
        setSelected(CATEGORIES[0]||'');
        onTaxonomyChange && onTaxonomyChange();
        alert('Categorías restablecidas. Ahora tocá "Reaplicar" arriba para actualizar tus compras existentes.');
      }}
        style={{width:'100%',padding:'10px 0',borderRadius:10,fontSize:12,fontWeight:600,marginBottom:16,
          background:d?'#2a1a00':'#fff3e0',border:`1px solid ${d?'#5a3a10':'#ffd9a0'}`,color:'#f97316'}}>
        ♻️ Restablecer a las 15 categorías nuevas
      </button>

      {/* Category chips + add button */}
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
        {cats.map(c=>(
          <button key={c} onClick={()=>{setSelected(c);setRenaming(false);}}
            style={{padding:'5px 10px',borderRadius:8,fontSize:11,border:`1px solid ${selected===c?'#f97316':d?'#2a2a35':'#d4cfc9'}`,
              background:selected===c?'#f97316':d?'#1a1a22':'#f2f0eb',
              color:selected===c?'#0f0f13':d?'#888':'#666'}}>
            {c}
          </button>
        ))}
        {!addingCat ? (
          <button onClick={()=>setAddingCat(true)}
            style={{padding:'5px 10px',borderRadius:8,fontSize:11,border:`1px dashed ${d?'#3a3a45':'#c4bfb9'}`,background:'transparent',color:'#f97316'}}>
            + Nueva
          </button>
        ) : (
          <div style={{display:'flex',gap:4}}>
            <input value={newCatName} onChange={e=>setNewCatName(e.target.value)} placeholder="Nombre"
              onKeyDown={e=>e.key==='Enter'&&handleAddCategory()}
              autoFocus
              style={{padding:'5px 8px',borderRadius:8,fontSize:11,border:'1px solid #f97316',background:d?'#0f0f13':'#fff',color:d?'#f0ede8':'#1a1a22',width:100}}/>
            <button onClick={handleAddCategory} style={{padding:'5px 8px',borderRadius:8,fontSize:11,background:'#f97316',border:'none',color:'#0f0f13'}}>✓</button>
            <button onClick={()=>{setAddingCat(false);setNewCatName('');}} style={{padding:'5px 8px',borderRadius:8,fontSize:11,background:T.inactBg(d),border:'none',color:T.muted(d)}}>✕</button>
          </div>
        )}
      </div>

      {selected && (
        <div style={{background:d?'#0f0f13':'#f7f5f2',borderRadius:12,padding:'14px 16px',border:`1px solid ${d?'#2a2a35':'#e0ddd8'}`}}>
          {/* Header with rename/delete actions */}

                <div style={{fontSize:13,color:'#f97316',fontWeight:600,flex:1}}>{selected}</div>
                <button onClick={()=>{setRenaming(true);setRenameVal(selected);}}
                  style={{fontSize:11,padding:'4px 9px',borderRadius:7,background:T.inactBg(d),border:`1px solid ${T.inactBdr(d)}`,color:T.muted(d)}}>

                </button>
                <button onClick={handleDeleteCategory}

              <>
                <input value={renameVal} onChange={e=>setRenameVal(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&handleRename()}
                  autoFocus
                  style={{flex:1,padding:'6px 10px',borderRadius:8,fontSize:12,border:'1px solid #f97316',background:d?'#1a1a22':'#fff',color:d?'#f0ede8':'#1a1a22'}}/>
                <button onClick={handleRename} style={{fontSize:11,padding:'6px 10px',borderRadius:7,background:'#f97316',border:'none',color:'#0f0f13'}}>Guardar</button>
                <button onClick={()=>setRenaming(false)} style={{fontSize:11,padding:'6px 10px',borderRadius:7,background:T.inactBg(d),border:'none',color:T.muted(d)}}>✕</button>
              </>

                <span>{n}</span>

        <div style={{marginTop:14,padding:'12px 14px',borderRadius:10,background:d?'#1a1a2a':'#f0f0ff',border:`1px solid ${d?'#3a3a6a':'#c8c8f0'}`}}>
          <div style={{fontSize:12,marginBottom:8,color:d?'#a0a0e0':'#5050a0'}}>

              style={{padding:'8px 14px',borderRadius:8,fontSize:12,background:moveTarget?'#f97316':T.inactBg(d),border:'none',color:moveTarget?'#0f0f13':T.muted(d)}}>
              Mover

            <button onClick={()=>setMovingNombre(null)}
              style={{padding:'8px 10px',borderRadius:8,fontSize:12,background:T.inactBg(d),border:'none',color:T.muted(d)}}>
