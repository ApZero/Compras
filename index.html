}

// ── CATALOGO ──────────────────────────────────────────────────────────────────
function Catalogo({productsDict, setProductsDict}) {
  const d = useTheme()==='dark';
  const [q, setQ]               = useState('');
  const [editItem, setEditItem]  = useState(null);
  const [filterCat, setFilterCat]= useState('');

  const safeDict = productsDict || {};
  const list = useMemo(() => {
    let arr = Object.values(safeDict);
    if (filterCat) arr = arr.filter(p => p.category === filterCat);
    if (q) {
      const lq = q.toLowerCase();
      arr = arr.filter(p => p.rawName.toLowerCase().includes(lq)||(p.nombre||'').toLowerCase().includes(lq)||(p.category||'').toLowerCase().includes(lq));
    }
    return arr.sort((a,b) => (a.nombre||a.rawName).localeCompare(b.nombre||b.rawName, 'es'));
  }, [safeDict, q, filterCat]);

  const cats = useMemo(() => [...new Set(Object.values(safeDict).map(p=>p.category).filter(Boolean))].sort(), [safeDict]);
  const unassigned = Object.values(safeDict).filter(p=>!p.nombre).length;

  const sizeLabel = p => p.packageSize ? `${p.packageSize}${p.packageSizeUnit||''}` : null;

  return (
    <div className="fade" style={{padding:'16px 20px',display:'flex',flexDirection:'column',gap:12}}>
      {editItem && <CatalogoEditModal item={editItem} onSave={updated=>{setProductsDict(prev=>{const p=prev||{};const n={...p};n[updated.barcode]=updated;return n;});setEditItem(null);}} onDelete={bc=>{if(!confirm('Eliminar del catálogo?'))return;setProductsDict(prev=>{const p=prev||{};const n={...p};delete n[bc];return n;});setEditItem(null);}} onClose={()=>setEditItem(null)}/>}

      {unassigned>0 && (
        <div style={{background:T.warnBg(d),border:'1px solid #f97316',borderRadius:12,padding:'10px 14px',fontSize:12,color:'#f97316'}}>
          ⚠ {unassigned} productos sin nombre asignado — estos no se auto-completarán al importar XML
        </div>
      )}

      <Inp value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar producto, nombre, categoría…"/>

      <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
        <button onClick={()=>setFilterCat('')} style={{padding:'5px 10px',borderRadius:8,fontSize:11,border:`1px solid ${!filterCat?'#f97316':T.inactBdr(d)}`,background:!filterCat?'#f97316':T.inactBg(d),color:!filterCat?'#0f0f13':T.inactClr(d)}}>Todos</button>
        {cats.map(c=>(
          <button key={c} onClick={()=>setFilterCat(filterCat===c?'':c)} style={{padding:'5px 10px',borderRadius:8,fontSize:11,border:`1px solid ${filterCat===c?'#f97316':T.inactBdr(d)}`,background:filterCat===c?'#f97316':T.inactBg(d),color:filterCat===c?'#0f0f13':T.inactClr(d)}}>{c}</button>
        ))}
        <span style={{marginLeft:'auto',fontSize:11,color:T.sub(d)}}>{list.length} productos</span>
      </div>

      <div style={{...T.card(d),overflow:'hidden'}}>
        {list.length===0 && <div style={{padding:28,textAlign:'center',color:T.sub(d),fontSize:13}}>{Object.keys(safeDict).length===0 ? 'Cargando catálogo…' : 'Sin resultados'}</div>}
        {list.map((p,i)=>(
          <div key={p.barcode} onClick={()=>setEditItem(p)}
            style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',cursor:'pointer',borderBottom:i<list.length-1?`1px solid ${T.divider(d)}`:'none',transition:'background 0.15s'}}
            onMouseEnter={e=>e.currentTarget.style.background=T.rowHov(d)}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,color:T.text(d),overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.rawName}</div>
              <div style={{display:'flex',gap:5,marginTop:3,flexWrap:'wrap',alignItems:'center'}}>
                {p.nombre
                  ? <span className="badge" style={{background:T.okBg(d),color:'#4ade80'}}>{p.nombre}</span>
                  : <span className="badge" style={{background:d?'#2a1500':'#fff3e0',color:'#f97316'}}>⚠ Sin asignar</span>
                }
                {p.category && <span className="badge" style={{background:T.inactBg(d),color:T.muted(d)}}>{p.category}</span>}
                {sizeLabel(p) && <span className="badge" style={{background:d?'#1a2030':'#e8f0ff',color:'#60a5fa'}}>{sizeLabel(p)}</span>}
              </div>
            </div>
            <div style={{color:T.sub(d),fontSize:11}}>✎</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function CatalogoEditModal({item, onSave, onDelete, onClose}) {
  const d = useTheme()==='dark';
  const [nombre,    setNombre]   = useState(item.nombre||'');
  const [newNombre, setNewNombre]= useState('');
  const [useNew,    setUseNew]   = useState(false);
  const [category,  setCategory] = useState(item.category||'');
  const [pkgSize,   setPkgSize]  = useState(item.packageSize!=null?String(item.packageSize):'');
  const [pkgUnit,   setPkgUnit]  = useState(item.packageSizeUnit||'');

  const save = () => {
    const finalNombre = useNew ? newNombre.trim() : nombre;
    onSave({...item, nombre:finalNombre, category, packageSize:pkgSize?parseFloat(pkgSize):null, packageSizeUnit:pkgUnit||null});
  };

  return (
    <Modal title="Editar producto del catálogo" onClose={onClose}>
      <div style={{background:T.infoBg(d),borderRadius:10,padding:'11px 14px',marginBottom:18,border:`1px solid ${T.inactBdr(d)}`}}>
        <div style={{fontSize:13,color:'#f97316',fontWeight:600,marginBottom:2}}>{item.rawName}</div>
        {item.barcode&&!item.barcode.startsWith('name:')&&<div style={{fontSize:10,color:T.sub(d),marginTop:2}}>Código: {item.barcode}</div>}
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Nombre friendly</FieldLabel>
        <Sel value={useNew?'__new__':nombre} onChange={e=>{
          if(e.target.value==='__new__'){setUseNew(true);setNombre('');}
          else{setUseNew(false);setNombre(e.target.value);if(NOMBRE_TO_CAT[e.target.value])setCategory(NOMBRE_TO_CAT[e.target.value]);}
        }}>
          <option value="">— Seleccionar —</option>
          {ALL_NOMBRES.map(n=><option key={n} value={n}>{n}</option>)}
          <option value="__new__">+ Nuevo nombre…</option>
        </Sel>
        {useNew&&<Inp value={newNombre} onChange={e=>setNewNombre(e.target.value)} placeholder="ej: Yoghurt" style={{marginTop:8,borderColor:'#f97316'}}/>}
      </div>

      <div style={{marginBottom:14}}>
        <FieldLabel>Categoría</FieldLabel>
        <Sel value={category} onChange={e=>setCategory(e.target.value)}>
          <option value="">— Seleccionar —</option>
          {CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
        </Sel>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:20}}>
        <div>
          <FieldLabel>Tamaño del envase</FieldLabel>
          <Inp value={pkgSize} onChange={e=>setPkgSize(e.target.value)} type="number" step="0.001" placeholder="ej: 1 / 0.5 / 0.6"/>
        </div>
        <div>
          <FieldLabel>Unidad del envase</FieldLabel>
          <Sel value={pkgUnit} onChange={e=>setPkgUnit(e.target.value)}>
            <option value="">— N/A —</option>
            {['kg','g','L','ml','rollos','UNI'].map(u=><option key={u}>{u}</option>)}
          </Sel>
        </div>
      </div>

      <div style={{fontSize:11,color:T.sub(d),marginBottom:16,padding:'8px 12px',background:T.infoBg(d),borderRadius:8,border:`1px solid ${T.inactBdr(d)}`}}>
        💡 La próxima vez que importes un XML con este producto, se completará automáticamente.
      </div>

      <div style={{display:'flex',gap:10}}>
        <Btn onClick={save} style={{flex:2}}>Guardar</Btn>
        <Btn onClick={()=>onDelete(item.barcode)} variant="danger" style={{flex:1}}>Eliminar</Btn>
      </div>
    </Modal>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [theme,setTheme] = useState(()=>{ try{ return localStorage.getItem(LS_THEME)||'dark'; }catch{ return 'dark'; } });
  const [palKey,setPalKey] = useState(()=>getPalKey());
  const setPalette = k => { PAL=PALETTES[k]||PALETTES.earthy; setPalKey(k); saveSetting('palette', k); };
  const d = theme==='dark';
  const isDesktop = useIsDesktop();
  useEffect(()=>{
    document.body.style.background = T.bg(d);
    const meta = document.getElementById('theme-color-meta');
    if(meta) meta.content = T.bg(d);
    try{ localStorage.setItem(LS_THEME,theme); }catch{}
  },[theme,d]);

  const [purchases,setPurchases]       = useState([]);
  const [selectedYear,setSelectedYear] = useState(null); // null = "Todos los años" until first load sets default
  const [productsDict,setProductsDict] = useState({});
  const productsDictRef = useRef({});
  const [loading,setLoading]           = useState(true);
  // Keep a ref in sync so ImportModal always sees the latest catalogue
  useEffect(() => { productsDictRef.current = productsDict; }, [productsDict]);
  const [taxonomyVersion,setTaxonomyVersion] = useState(0);
  const [loadError,setLoadError]       = useState('');
  const [syncing,setSyncing]           = useState(false);
  const [toast,setToast]               = useState('');
  const purchasesRef = useRef([]);
  useEffect(() => { purchasesRef.current = purchases; }, [purchases]);

  // ── Load everything from local storage (IndexedDB) ───────────────────────────
  const loadAll = useCallback(async () => {
    const [ps, pd, themeSetting, palSetting, taxonomy] = await Promise.all([
      loadPurchases(),
      loadProductsDict(),
      loadSetting('theme'),
      loadSetting('palette'),
      loadTaxonomy(),
    ]);
    if (taxonomy) { applyTaxonomyOverride(taxonomy); setTaxonomyVersion(v=>v+1); }
    // Lightweight product dict built from NOMBRE_TO_CAT for first-run seeding
    const seedPd = Object.fromEntries(
      Object.entries(NOMBRE_TO_CAT).map(([nombre, category]) => {
        const key = 'name:' + nombre.toLowerCase();
        return [key, {barcode: key, rawName: nombre, nombre, category, packageSize: null, packageSizeUnit: null}];
      })
    );
    const finalPs = ps && ps.length > 0 ? ps : [];
    const finalPd = pd && Object.keys(pd).length > 0 ? pd : seedPd;
    if (!pd || Object.keys(pd).length === 0) await saveProductsDict(seedPd);
    setPurchases(finalPs);
    setProductsDict(finalPd);
    const yrs = [...new Set(finalPs.map(p => yearOf(p.date)))];
    if (yrs.length > 0) setSelectedYear(Math.max(...yrs));
    if (themeSetting) setTheme(themeSetting);
    if (palSetting) { PAL = getPal(palSetting); setPalKey(palSetting); }
  }, []);

  useEffect(()=>{
    let cancelled = false;
    (async () => {
      try {
        if (!window.indexedDB) throw new Error('Este navegador no soporta almacenamiento local (IndexedDB).');
        requestPersistence();
        await loadAll();
      } catch(e) {
        console.error('Init error:', e);
        if (!cancelled) setLoadError('Error: ' + (e.message || e.toString()));
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // ── Automatic daily backup: first interaction of each day downloads a JSON ────
  // (Runs on a user gesture so browsers allow the download.)
  useEffect(() => {
    if (loading) return;
    let busy = false;
    const handler = async () => {
      if (busy) return;
      const key = localDayKey();
      let last = null;
      try { last = localStorage.getItem(LS_LAST_BACKUP); } catch {}
      if (last === key) return;
      if (!purchasesRef.current.length) return; // nothing to back up yet
      busy = true;
      try {
        const payload = await buildBackupPayload();
        downloadJSON(payload, `mercado2026_backup_${key}.json`);
        try { localStorage.setItem(LS_LAST_BACKUP, key); } catch {}
        setToast('💾 Backup diario descargado');
        setTimeout(() => setToast(''), 3500);
      } catch(e) { console.error('auto-backup:', e); }
      busy = false;
    };
    const evts = ['pointerup', 'keydown', 'touchend', 'click'];
    evts.forEach(ev => window.addEventListener(ev, handler, { capture: true, passive: true }));
    return () => evts.forEach(ev => window.removeEventListener(ev, handler, { capture: true }));
  }, [loading]);

  // Navigation stack: each entry is {view, catName?, nombreItem?}
  const [view,setView]           = useState('dashboard');
  const [selectedCat,setSCat]    = useState(null);   // category name string
  const [selectedNombre,setSNombre] = useState(null); // nombre summary object
  const [editingP,setEditingP]   = useState(null);
  const [showImport,setShowImport] = useState(false);
  const [showAddManual,setShowAddManual] = useState(false);
  const [showQR,setShowQR] = useState(false);
  const [showCatMgr,setShowCatMgr] = useState(false);
  const [showCompare,setShowCompare]   = useState(false);
  const [compareInitial,setCompareInitial] = useState('');
  const [showBackup,setShowBackup] = useState(false);

  const availableYears = useMemo(() => {
    const years = new Set(purchases.map(p => yearOf(p.date)));
    return [...years].sort((a,b) => b - a); // newest first
  }, [purchases]);

  const filteredPurchases = useMemo(() => {
    if (selectedYear == null) return purchases; // "Todos" or not yet initialized
    return purchases.filter(p => yearOf(p.date) === selectedYear);
  }, [purchases, selectedYear]);

  const usedIds    = useMemo(()=>new Set(purchases.map(p=>p.invoiceId)),[purchases]);
  const uncatCount = useMemo(()=>purchases.filter(p=>!p.category).length,[purchases]);
  const allCategories = useMemo(()=>{
    const fromData = [...new Set(purchases.map(p=>p.category).filter(Boolean))];
    const merged   = [...new Set([...CATEGORIES,...fromData])].sort((a,b)=>a.localeCompare(b,'es'));
    return merged;
  },[purchases]);

  const handleImport  = useCallback(async ({purchases:np})=>{
    setSyncing(true);
    try {
      // Save all purchases in one batched call (handles both single XML and ZIP batch)
      await savePurchases(np);
      // Single atomic state update
      setPurchases(prev => {
        const existingIds = new Set(prev.map(p => p.id));
        const newOnes = np.filter(p => !existingIds.has(p.id));
        return [...prev, ...newOnes];
      });

      // Migrate name-keyed catalogue entries to real barcodes
      const migrations = np.filter(p => p._migrateFromKey && p.barcode);
      if (migrations.length > 0) {
        const oldKeysToDelete = [];
        setProductsDict(prev => {
          const next = {...(prev||{})};
          for (const p of migrations) {
            const old = next[p._migrateFromKey];
            if (!old) continue;
            next[p.barcode] = {
              ...old,
              barcode: p.barcode,
              rawName: p.rawName,
              packageSize: old.packageSize ?? p.packageSize,
              packageSizeUnit: old.packageSizeUnit ?? p.packageSizeUnit,
            };
            delete next[p._migrateFromKey];
            oldKeysToDelete.push(p._migrateFromKey);
          }
          saveProductsDict(next).catch(e=>console.error('migrate saveProductsDict:', e));
          return next;
        });
        for (const oldKey of oldKeysToDelete) {
          dbDelete('products_dict', oldKey).catch(()=>{});
        }
      }
    } catch(e) {
      alert('Error al guardar: ' + e.message);
      console.error(e);
    }
    setSyncing(false);
  },[]);
  const handleSave    = useCallback(async u=>{
    setSyncing(true);
    try {
      // Compute propagated purchases synchronously BEFORE any state update
      // so we can save them all in one call
      const propagated = purchases
        .filter(p => p.id !== u.id && p.rawName === u.rawName && (
          p.nombre !== u.nombre ||
          p.category !== u.category ||
          p.packageSize !== u.packageSize ||
          p.packageSizeUnit !== u.packageSizeUnit
        ))
        .map(p => ({
          ...p,
          nombre: u.nombre,
          category: u.category,
          packageSize: u.packageSize ?? p.packageSize,
          packageSizeUnit: u.packageSizeUnit ?? p.packageSizeUnit,
        }));

      // Save first — all in one batch
      await savePurchases([u, ...propagated]);

      // Then update local state
      const allUpdated = [u, ...propagated];
      const updatedById = Object.fromEntries(allUpdated.map(p => [p.id, p]));
      setPurchases(prev => prev.map(p => updatedById[p.id] || p));
      setEditingP(null);

      // Update catalogue so future imports auto-fill this rawName
      if (u.nombre || u.category) {
        const nameKey = 'name:' + u.rawName.toLowerCase();
        // Build just the entries that changed — don't save the whole dict
        const entriesToSave = [];
        setProductsDict(prev => {
          const next = { ...(prev||{}) };
          const existing = next[u.barcode] || next[nameKey] || {};
          const entry = {
            ...existing,
            barcode: u.barcode || nameKey,
            rawName: u.rawName,
            nombre: u.nombre || existing.nombre,
            category: u.category || existing.category,
            packageSize: u.packageSize ?? existing.packageSize ?? null,
            packageSizeUnit: u.packageSizeUnit ?? existing.packageSizeUnit ?? null,
          };
          if (u.barcode && u.barcode !== nameKey) {
            next[u.barcode] = entry;
            entriesToSave.push(entry);
          }
          const nameEntry = {...entry, barcode: nameKey};
          next[nameKey] = nameEntry;
          entriesToSave.push(nameEntry);
          return next;
        });
        // Upsert just these 1-2 catalogue entries directly
        try {
          await dbUpsert('products_dict', entriesToSave.map(e => ({ barcode: e.barcode, data: e })));
        } catch(e) {
          alert('Error al guardar en catálogo: ' + e.message);
          console.error('catalogue save error:', e);
        }
      }

      if (propagated.length > 0) {
        console.log(`Propagated nombre/category to ${propagated.length} other purchases`);
      }
    } catch(e) {
      alert('Error al guardar: ' + e.message);
      console.error(e);
    }
    setSyncing(false);
  },[purchases]);
  const handleDelete  = useCallback(async id=>{
    setSyncing(true);
    await deletePurchase(id);
    setPurchases(prev=>prev.filter(p=>p.id!==id));
    setEditingP(null);
    setSyncing(false);
  },[]);
  const handleRestore = useCallback(async data=>{
    setSyncing(true);
    try {
      await restoreFromBackup(data);
      await loadAll();
      setShowBackup(false);
    } catch(e) {
      alert('Error al restaurar: ' + e.message);
      console.error(e);
    }
    setSyncing(false);
  },[loadAll]);

  const handleAddNew = useCallback(()=>{
    setEditingP({
      id: uid(),
      invoiceId: 'manual-'+uid(),
      date: today(),
      store: '',
      rawName: '',
      barcode: '',
      category: '',
      nombre: '',
      packageSize: null,
      packageSizeUnit: null,
      qty: 1,
      unit: 'UNI',
      unitPrice: 0,
      total: 0,
      _isNew: true,
    });
  },[]);

  const handleAddManual = useCallback(async p=>{
    setSyncing(true);
    try {
      await savePurchases([p]);
      setPurchases(prev=>[...prev, p]);
      // Add/update catalogue entry too, so future autocomplete picks it up
      setProductsDict(prev=>{
        const next = {...(prev||{})};
        if (!next[p.barcode]) {
          next[p.barcode] = {
            barcode: p.barcode, rawName: p.rawName, nombre: p.nombre,
            category: p.category, packageSize: p.packageSize, packageSizeUnit: p.packageSizeUnit,
          };
          saveProductsDict(next).catch(e=>console.error('saveProductsDict:', e));
        }
        return next;
      });
      setShowAddManual(false);
    } catch(e) {
      alert('Error al guardar: ' + e.message);
      console.error(e);
    }
    setSyncing(false);
  },[]);

  const handleReapplyTaxonomy = useCallback(async () => {
    setSyncing(true);
    try {
      const updated = purchases.map(p => {
        const cat = NOMBRE_TO_CAT[p.nombre];
        return cat && cat !== p.category ? {...p, category: cat} : p;
      });
      const changed = updated.filter((p,i) => p.category !== purchases[i].category);
      if (changed.length > 0) {
        await savePurchases(changed);
        setPurchases(updated);
      }
      // Also reapply to the catalogue itself
      setProductsDict(prev => {
        const next = {...(prev||{})};
        let dictChanged = false;
        for (const key of Object.keys(next)) {
          const entry = next[key];
          const cat = NOMBRE_TO_CAT[entry.nombre];
          if (cat && cat !== entry.category) {
            next[key] = {...entry, category: cat};
            dictChanged = true;
          }
        }
        if (dictChanged) saveProductsDict(next).catch(e=>console.error('saveProductsDict:', e));
        return next;
      });
      alert(`Categorías actualizadas en ${changed.length} compras.`);
    } catch(e) {
      alert('Error al reaplicar categorías: ' + e.message);
      console.error(e);
    }
    setSyncing(false);
  }, [purchases]);

  const handleEraseAll = useCallback(async () => {
    setSyncing(true);
    try {
      await deleteAllPurchases();
      setPurchases([]);
    } catch(e) {
      alert('Error al borrar: ' + e.message);
    }
    setSyncing(false);
  }, []);

  const handleSetProductsDict = useCallback(updater=>{
    setProductsDict(prev=>{
      const old = prev||{};
      const next = typeof updater==='function' ? updater(old) : updater;
      // Find only the entries that changed and upsert just those
      const changed = Object.values(next).filter(e => {
        const o = old[e.barcode];
        return !o || JSON.stringify(o) !== JSON.stringify(e);
      });
      const removed = Object.keys(old).filter(k => !next[k]);
      if (changed.length > 0) {
        dbUpsert('products_dict', changed.map(e => ({ barcode: e.barcode, data: e })))
          .catch(e => console.error('saveProductsDict:', e));
      }
      for (const k of removed) {
        dbDelete('products_dict', k).catch(() => {});
      }
      return next;
    });
  },[]);

  // Live-recompute selectedNombre when purchases change
  const liveNombre = useMemo(()=>{
    if(!selectedNombre||!selectedCat) return null;
    const summary = buildNombreSummary(filteredPurchases, selectedCat);
    return summary.find(n=>n.name===selectedNombre)||null;
  },[filteredPurchases,selectedCat,selectedNombre]);
  // For direct Productos tab navigation (no category filter)
  const liveNombreGlobal = useMemo(()=>{
    if(!selectedNombre) return null;
    const summary = buildNombreSummary(filteredPurchases, null);
    return summary.find(n=>n.name===selectedNombre)||null;
  },[filteredPurchases,selectedNombre]);

  const NAV = [{id:'dashboard',label:'📊',full:'Resumen'},{id:'cats',label:'🏷',full:'Categorías'},{id:'productos',label:'🥦',full:'Productos'},{id:'compras',label:'🧾',full:'Compras'},{id:'catalogo',label:'📋',full:'Catálogo'}];

  const goNav = id => { setView(id); setSCat(null); setSNombre(null); };

  return (
    <ThemeCtx.Provider value={theme}>
      <div style={{minHeight:'100vh',background:T.bg(d),color:T.text(d),fontFamily:"'DM Mono','Courier New',monospace",maxWidth:isDesktop?900:480,margin:'0 auto',paddingBottom:isDesktop?40:80,transition:'background 0.3s,color 0.3s,max-width 0.2s'}}>

        {showImport && <ImportModal onImport={handleImport} onClose={()=>setShowImport(false)} usedIds={usedIds} productsDict={productsDict} productsDictRef={productsDictRef}/>}
      {showAddManual && <AddModal onAdd={handleAddManual} onClose={()=>setShowAddManual(false)} allCategories={allCategories} productsDict={productsDict}/>}
      {showQR && <QRScanModal onClose={()=>setShowQR(false)}/>}
        {editingP   && <EditModal purchase={editingP} onSave={handleSave} onDelete={handleDelete} onClose={()=>setEditingP(null)} allCategories={allCategories}/>}
        {showBackup && <BackupModal purchases={purchases} onRestore={handleRestore} onEraseAll={handleEraseAll} onClose={()=>setShowBackup(false)}/>}
      {showCatMgr && <CategoryManager onClose={()=>setShowCatMgr(false)} onTaxonomyChange={handleReapplyTaxonomy}/>}
      {showCompare && <CompareModal purchases={purchases} initialA={compareInitial} onClose={()=>{setShowCompare(false);setCompareInitial('');}}/>}

        {/* Header */}
        <div style={{padding:'18px 20px 14px',borderBottom:`1px solid ${T.hdrBdr(d)}`,display:'flex',alignItems:'center',gap:8}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,letterSpacing:-0.5}}>
              <span style={{color:'#f97316'}}>COMPRAS</span>
            </div>
            <div style={{fontSize:11,color:T.sub(d),marginTop:2,letterSpacing:0.5}}>Gastos del hogar</div>
          </div>
          {/* Dropdown menu */}
          {(()=>{
            const [open,setOpen] = React.useState(false);
            const ref = React.useRef();
            React.useEffect(()=>{
              const fn = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
              document.addEventListener('mousedown',fn);
              return ()=>document.removeEventListener('mousedown',fn);
            },[]);
            const item = (icon,label,action) => (
              <button key={label} onClick={()=>{setOpen(false);action();}}
                style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',background:'none',border:'none',
                  width:'100%',textAlign:'left',cursor:'pointer',color:T.text(d),fontSize:13,
                  borderBottom:`1px solid ${T.divider(d)}`}}
                onMouseEnter={e=>e.currentTarget.style.background=T.rowHov(d)}
                onMouseLeave={e=>e.currentTarget.style.background='none'}>
                <span style={{fontSize:18,width:24,textAlign:'center'}}>{icon}</span>{label}
              </button>
            );
            return (
              <div ref={ref} style={{position:'relative'}}>
                <button onClick={()=>setOpen(o=>!o)}
                  style={{background:open?'#f97316':T.inactBg(d),border:`1px solid ${open?'#f97316':T.inactBdr(d)}`,
                    borderRadius:10,fontSize:20,width:38,height:38,display:'flex',alignItems:'center',
                    justifyContent:'center',color:open?'#0f0f13':T.text(d),cursor:'pointer'}}>
                  ⋮
                </button>
                {open && (
                  <div style={{position:'absolute',top:44,right:0,zIndex:200,minWidth:220,
                    background:d?'#1a1a22':'#fff',borderRadius:14,boxShadow:'0 8px 32px rgba(0,0,0,0.25)',
                    border:`1px solid ${T.inactBdr(d)}`,overflow:'hidden'}}>
                    {item('✏️','Agregar compra manual',()=>setShowAddManual(true))}
                    {item('📷','Escanear QR',()=>setShowQR(true))}
                    {item('🏷','Editor de categorías',()=>setShowCatMgr(true))}
                    {item('💾','Backup y restauración',()=>setShowBackup(true))}
                    {item(d?'☀️':'🌙',d?'Modo claro':'Modo oscuro',()=>setTheme(d?'light':'dark'))}
                  </div>
                )}
              </div>
            );
          })()}
          <button onClick={()=>setShowImport(true)}
            style={{background:'#f97316',border:'none',borderRadius:10,color:'#0f0f13',fontSize:12,fontWeight:700,padding:'9px 14px',display:'flex',alignItems:'center',gap:5,cursor:'pointer'}}>
            <span style={{fontSize:16,lineHeight:1}}>+</span> XML
          </button>
        </div>

        {/* Nav */}
        <div style={{display:'flex',gap:isDesktop?10:6,padding:isDesktop?'14px 28px':'10px 20px',background:T.navBg(d),position:'sticky',top:0,zIndex:50,borderBottom:`1px solid ${T.hdrBdr(d)}`}}>
          {NAV.map(n=>{
            const active = view===n.id||(n.id==='cats'&&(view==='nombres'||view==='nombre-detail'))||(n.id==='productos'&&view==='producto-detail');
            return (
              <button key={n.id} onClick={()=>goNav(n.id)}
                style={isDesktop ? {
                  flex:'0 1 auto',padding:'9px 18px',borderRadius:10,fontSize:13,fontWeight:600,letterSpacing:0.3,textTransform:'uppercase',
                  border:`1px solid ${active?'#f97316':T.inactBdr(d)}`,
                  background:active?'#f97316':T.inactBg(d),
                  color:active?'#0f0f13':T.inactClr(d),
                  transition:'all 0.2s',position:'relative',display:'flex',alignItems:'center',gap:8,cursor:'pointer'
                } : {
                  flex:1,padding:'6px 2px',borderRadius:10,fontSize:active?11:13,fontWeight:500,letterSpacing:0,textTransform:'uppercase',
                  border:`1px solid ${active?'#f97316':T.inactBdr(d)}`,
                  background:active?'#f97316':T.inactBg(d),
                  color:active?'#0f0f13':T.inactClr(d),
                  transition:'all 0.2s',position:'relative'
                }}>
                {isDesktop ? (
                  <>
                    <span style={{fontSize:15}}>{n.label}</span>
                    <span>{n.full}</span>
                  </>
                ) : (
                  <>
                    <div style={{fontSize:14,lineHeight:1}}>{n.label}</div>
                    {active && <div style={{fontSize:9,marginTop:2,letterSpacing:0.3}}>{n.full}</div>}
                  </>
                )}
                {n.id==='compras'&&uncatCount>0&&(
                  <span style={{position:'absolute',top:-5,right:-5,background:'#ef4444',borderRadius:'50%',minWidth:17,height:17,fontSize:9,fontWeight:700,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',padding:'0 3px'}}>
                    {uncatCount}
                  </span>
                )}
              </button>
            );
          })}
        </div>

        {/* Year selector — only shown if there's more than one year of data */}
        {availableYears.length > 1 && (view==='dashboard'||view==='cats'||view==='nombres'||view==='productos'||view==='producto-detail'||view==='nombre-detail') && (
          <div style={{display:'flex',gap:6,padding:isDesktop?'10px 28px':'8px 20px',background:T.navBg(d),borderBottom:`1px solid ${T.hdrBdr(d)}`,overflowX:'auto'}}>
            <button onClick={()=>setSelectedYear(null)}
              style={{padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:600,whiteSpace:'nowrap',
                border:`1px solid ${selectedYear==null?'#f97316':T.inactBdr(d)}`,
                background:selectedYear==null?'#f97316':T.inactBg(d),
                color:selectedYear==null?'#0f0f13':T.inactClr(d)}}>
              Todos los años
            </button>
            {availableYears.map(y => (
              <button key={y} onClick={()=>setSelectedYear(y)}
                style={{padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:600,whiteSpace:'nowrap',
                  border:`1px solid ${selectedYear===y?'#f97316':T.inactBdr(d)}`,
                  background:selectedYear===y?'#f97316':T.inactBg(d),
                  color:selectedYear===y?'#0f0f13':T.inactClr(d)}}>
                {y}
              </button>
            ))}
          </div>
        )}

        {/* Syncing indicator */}
        {syncing && !loading && (
          <div style={{position:'fixed',top:8,right:8,zIndex:500,background:'#f97316',borderRadius:20,padding:'4px 12px',fontSize:11,color:'#0f0f13',fontWeight:600,display:'flex',alignItems:'center',gap:6}}>
            <div style={{width:10,height:10,border:'2px solid #0f0f13',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.6s linear infinite'}}/>
            Guardando… no cierres la página
          </div>
        )}

        {loadError && (
          <div style={{margin:'12px 20px',padding:'12px 14px',borderRadius:12,fontSize:12,background:d?'#2a1a1a':'#fff5f5',color:'#f87171',border:'1px solid #5a2a2a'}}>
            ⚠ No se pudo abrir el almacenamiento local. {loadError}
          </div>
        )}

        {toast && (
          <div style={{position:'fixed',left:'50%',bottom:24,transform:'translateX(-50%)',zIndex:600,background:'#f97316',color:'#0f0f13',borderRadius:20,padding:'8px 16px',fontSize:12,fontWeight:600,boxShadow:'0 4px 20px rgba(0,0,0,0.3)'}}>
            {toast}
          </div>
        )}

        {view==='dashboard'     && <Dashboard purchases={filteredPurchases} onGoCats={()=>goNav('cats')} onGoProductos={n=>{ if(n){ setSNombre(n); setView('producto-detail'); } else goNav('productos'); }} onGoCompras={()=>goNav('compras')}/>}
        {view==='cats'          && <CatList purchases={filteredPurchases} onSelectCat={cat=>{ setSCat(cat.name); setView('nombres'); }}/>}
        {view==='productos'     && <NombreList purchases={filteredPurchases} catName={null} onBack={null} onSelectNombre={n=>{ setSNombre(n); setView('producto-detail'); }} onCompare={n=>{setCompareInitial(n);setShowCompare(true);}}/>}
        {view==='producto-detail' && liveNombreGlobal && <NombreDetail nombreItem={liveNombreGlobal} onBack={()=>{ setSNombre(null); setView('productos'); }} onEditPurchase={setEditingP}/>}
        {view==='nombres'       && selectedCat && <NombreList purchases={filteredPurchases} catName={selectedCat} onBack={()=>setView('cats')} onSelectNombre={n=>{ setSNombre(n); setView('nombre-detail'); }} onCompare={n=>{setCompareInitial(n);setShowCompare(true);}}/>}
        {view==='nombre-detail' && liveNombre  && <NombreDetail nombreItem={liveNombre} onBack={()=>setView('nombres')} onEditPurchase={setEditingP}/>}
        {view==='compras'       && <ComprasList purchases={purchases} onEdit={setEditingP} allCategories={allCategories} onAddNew={handleAddNew}/>}
        {view==='catalogo'     && <Catalogo productsDict={productsDict||{}} setProductsDict={handleSetProductsDict}/>}
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
